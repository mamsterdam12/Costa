<!-- An event detail page in the shape the city agenda uses: labelled
     rows (Horario / Lugar / Precio), an og:image poster, and no
     schema.org markup. Rebuilt from what the page shows a reader --
     the same fields that were coming back empty. -->
<!DOCTYPE html>
<html lang="es-es"><head>
<title>Carnaval Moraga</title>
<meta property="og:title" content="Carnaval Moraga">
<meta property="og:description" content="XXI Moraga Carnavalesca con el Tr&iacute;o de C&aacute;diz &quot;Chema, Lali y Cateto&quot;.">
<meta property="og:image" content="/images/agenda/2026/moraga-carnavalesca-2026.jpg">
</head><body>
<header><img src="/templates/yootheme/images/logo-marbella.svg" alt="Turismo Marbella"></header>
<h1>Carnaval Moraga</h1>
<div class="uk-panel">
  <div class="uk-grid">
    <div class="el-label">Horario:</div>
    <div class="el-value">20.00 h en Boulevard Pablo R&aacute;ez</div>
  </div>
  <div class="uk-grid">
    <div class="el-label">Lugar:</div>
    <div class="el-value">Boulevard Pablo R&aacute;ez</div>
  </div>
  <div class="uk-grid">
    <div class="el-label">Direcci&oacute;n:</div>
    <div class="el-value">Boulevard Pablo R&aacute;ez s/n</div>
  </div>
  <div class="uk-grid">
    <div class="el-label">C&oacute;digo postal:</div>
    <div class="el-value">29601</div>
  </div>
  <div class="uk-grid">
    <div class="el-label">Municipio:</div>
    <div class="el-value">Marbella</div>
  </div>
  <div class="uk-grid">
    <div class="el-label">Precio:</div>
    <div class="el-value">Entrada gratuita</div>
  </div>
</div>
<img src="/images/agenda/2026/moraga-carnavalesca-2026.jpg" alt="Carnaval Moraga" width="600">
</body></html>
